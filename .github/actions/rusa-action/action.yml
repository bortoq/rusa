name: "rusa Voiceover"
description: "Generate voiceover translation for a video using rusa"
author: "rusa contributors"

branding:
  icon: "mic"
  color: "purple"

inputs:
  video:
    description: "Path to video file (.mkv, .mp4, .avi, etc.)"
    required: true
  srt:
    description: "Path to external subtitle file (.srt)"
    required: false
    default: ""
  lang:
    description: "Subtitle language ISO 639-1 code (ru, en, he, de, fr, ...)"
    required: false
    default: ""
  voice:
    description: "TTS voice name (e.g. ru-RU-SvetlanaNeural)"
    required: false
    default: ""
  tts_cmd:
    description: "Custom TTS command template with {in} {out} {voice}"
    required: false
    default: ""
  engine:
    description: "TTS engine (edge, piper, espeak, rhvoice, gtts, festival)"
    required: false
    default: "edge"
  speed:
    description: "TTS speech speed (e.g. 1.5)"
    required: false
    default: "1.5"
  output:
    description: "Output file path"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ffmpeg
      shell: bash

    - name: Install rusa
      env:
        RUSA_ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install "$RUSA_ACTION_PATH/../../.."
      shell: bash

    - name: Run rusa
      env:
        RUSA_INPUT_VIDEO: ${{ inputs.video }}
        RUSA_INPUT_SRT: ${{ inputs.srt }}
        RUSA_INPUT_LANG: ${{ inputs.lang }}
        RUSA_INPUT_VOICE: ${{ inputs.voice }}
        RUSA_INPUT_TTS_CMD: ${{ inputs.tts_cmd }}
        RUSA_INPUT_ENGINE: ${{ inputs.engine }}
        RUSA_INPUT_SPEED: ${{ inputs.speed }}
        RUSA_INPUT_OUTPUT: ${{ inputs.output }}
      run: |
        args=()

        if [ -n "$RUSA_INPUT_SRT" ]; then
          args+=(-s "$RUSA_INPUT_SRT")
        fi

        if [ -n "$RUSA_INPUT_LANG" ]; then
          args+=(--lang "$RUSA_INPUT_LANG")
        fi

        if [ -n "$RUSA_INPUT_VOICE" ]; then
          args+=(--voice "$RUSA_INPUT_VOICE")
        fi

        if [ -n "$RUSA_INPUT_TTS_CMD" ]; then
          args+=(--tts-cmd "$RUSA_INPUT_TTS_CMD")
        fi

        if [ -n "$RUSA_INPUT_ENGINE" ] && [ "$RUSA_INPUT_ENGINE" != "edge" ]; then
          args+=(--engine "$RUSA_INPUT_ENGINE")
        fi

        if [ -n "$RUSA_INPUT_SPEED" ]; then
          args+=(--speed "$RUSA_INPUT_SPEED")
        fi

        if [ -n "$RUSA_INPUT_OUTPUT" ]; then
          args+=(-o "$RUSA_INPUT_OUTPUT")
        fi

        echo "::group::rusa output"
        rusa "${args[@]}" "$RUSA_INPUT_VIDEO"
        echo "::endgroup::"
      shell: bash

    - name: Upload output artifact
      uses: actions/upload-artifact@v4
      with:
        name: voiceover-output
        path: |
          ${{ inputs.output || '*.mkv' }}
          ${{ inputs.output || '*.mp4' }}
          ${{ inputs.output || '*.wav' }}
          ${{ inputs.output || '*.mp3' }}
        if-no-files-found: warn
