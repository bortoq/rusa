name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  offline-tests:
    name: offline tests (ubuntu, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pytest

      - name: Compile all Python files
        run: python -m compileall -q .

      - name: Run offline tests
        run: pytest -q -m 'not slow and not live_tts'

  smoke-matrix:
    name: cli smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          pip install . pytest

      - name: Compile all Python files
        run: python -m compileall -q .

      - name: Run CLI smoke tests
        run: pytest -q tests/test_cli_smoke.py

  build-package:
    name: build package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Install built wheel
        run: pip install dist/*.whl

      - name: Smoke check installed wheel outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          rusa --version
          rusa --help
          ffmpeg -y -loglevel error -f lavfi -i 'color=c=black:s=64x64:r=10:d=3' -f lavfi -i 'sine=frequency=440:duration=3' -map 0:v:0 -map 1:a:0 -c:v mpeg4 -c:a aac source.mkv
          ffmpeg -y -loglevel error -f lavfi -i 'sine=frequency=880:duration=3' -ac 2 -ar 48000 voice.wav
          python - <<'PY'
          from importlib.resources import files
          from pathlib import Path
          from rusa_engines import load_engine_configs
          from rusa_mux import step_mix_output
          from rusa_shared import CODEC_MAP

          assert files("rusa_data").joinpath("defaults.yaml").is_file()
          assert files("rusa_data").joinpath("engines.yaml").is_file()
          assert {"aac", "opus"} <= set(CODEC_MAP)
          assert "piper" in load_engine_configs()
          step_mix_output("source.mkv", "voice.wav", "0.5", "1", "output.mkv", ".", "aac", "128", None, False)
          assert Path("output.mkv").stat().st_size > 1000
          PY

  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.9

      - name: Run lint
        run: ruff check .

  docker-smoke:
    name: docker smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t rusa:test .

      - name: Smoke check Docker CLI
        run: |
          docker run --rm rusa:test --version
          docker run --rm rusa:test --help

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - offline-tests
      - smoke-matrix
      - build-package
      - lint
      - docker-smoke
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
